<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖</title>

<style>
  * { box-sizing: border-box; }

  body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #ffd1e8, #fff0f7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
  }

  .card {
    background: white;
    width: 90%;
    max-width: 360px;
    padding: 32px 20px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.15);
  }

  h2 {
    font-size: 22px;
    margin-bottom: 32px;
    color: #333;
  }

  .buttons {
    position: relative;
    height: 140px;
    overflow: hidden;
  }

  button {
    position: absolute;
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    user-select: none;
    touch-action: manipulation;
    transition:
      left 0.35s cubic-bezier(.25,1.4,.5,1),
      top  0.35s cubic-bezier(.25,1.4,.5,1);
    white-space: nowrap;
  }

  #yes {
    left: 40px;
    top: 50px;
    background: #ff4f9a;
    color: white;
    z-index: 2;
  }

  #no {
    left: 200px;
    top: 50px;
    background: #e0e0e0;
    z-index: 3;
  }
</style>
</head>

<body>

<div class="card">
  <h2>Will you be my Valentine🥺?</h2>

  <div class="buttons" id="zone">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<script>
  const noBtn  = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const zone   = document.getElementById("zone");

  /* 🔊 preload sounds */
  const soundFiles = ["s1.mp4","s2.mp4","s3.mp4","s4.mp4","s5.mp4"];
  const sounds = soundFiles.map(src => {
    const a = new Audio(src);
    a.preload = "auto";
    return a;
  });

  function playRandomSound() {
    const audio = sounds[Math.floor(Math.random() * sounds.length)];
    audio.currentTime = 0;
    audio.play();
  }

  /* 📝 NO button text sequence */
  const noTexts = [
    "really🥺?",
    "think again😉",
    "don't you love me😕?",
    "sorry, not this time😈",
    "No"
  ];
  let noCount = 0;

  function updateNoText() {
    if (noCount < noTexts.length) {
      noBtn.textContent = noTexts[noCount];
      noCount++;
    } else {
      noBtn.textContent = "No";
    }
  }

  function getSafePosition() {
    const zoneRect = zone.getBoundingClientRect();
    const yesRect  = yesBtn.getBoundingClientRect();
    const noRect   = noBtn.getBoundingClientRect();

    let x, y, safe = false;

    while (!safe) {
      x = Math.random() * (zoneRect.width  - noRect.width);
      y = Math.random() * (zoneRect.height - noRect.height);

      const future = {
        left: zoneRect.left + x,
        right: zoneRect.left + x + noRect.width,
        top: zoneRect.top + y,
        bottom: zoneRect.top + y + noRect.height
      };

      safe = !(
        future.right  > yesRect.left &&
        future.left   < yesRect.right &&
        future.bottom > yesRect.top &&
        future.top    < yesRect.bottom
      );
    }

    return { x, y };
  }

  function moveNo() {
    const pos = getSafePosition();

    /* force snap animation */
    noBtn.style.transition = "none";
    noBtn.offsetHeight;
    noBtn.style.transition =
      "left 0.35s cubic-bezier(.25,1.4,.5,1), top 0.35s cubic-bezier(.25,1.4,.5,1)";

    noBtn.style.left = pos.x + "px";
    noBtn.style.top  = pos.y + "px";

    updateNoText();
    playRandomSound();
  }

  /* 📱 MOBILE: move on tap */
  noBtn.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse") {
      e.preventDefault();
      moveNo();
    }
  });

  /* 💻 PC: move ONLY when cursor enters the NO button */
  noBtn.addEventListener("mouseenter", () => {
    // ignore touch devices
    if ("ontouchstart" in window) return;
    moveNo();
  });

  yesBtn.addEventListener("click", () => {
    window.location.href = "yay.html";
  });
</script>

</body>
</html>
