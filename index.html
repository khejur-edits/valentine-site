<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💖</title>

<style>
  * { box-sizing: border-box; }

  body {
    height: 100vh;
    margin: 0;
    background: linear-gradient(135deg, #ffd1e8, #fff0f7);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
  }

  .card {
    background: white;
    width: 90%;
    max-width: 360px;
    padding: 32px 20px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 18px 40px rgba(0,0,0,0.15);
  }

  h2 {
    font-size: 22px;
    margin-bottom: 32px;
    color: #333;
  }

  .buttons {
    position: relative;
    height: 90px;
  }

  button {
    position: absolute;
    top: 24px;
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    touch-action: manipulation;
    user-select: none;
    transform: none !important; /* HARD stop resize */
  }

  #yes {
    left: 40px;
    background: #ff4f9a;
    color: white;
    z-index: 2;
  }

  #no {
    left: 200px; /* start far from YES */
    background: #e0e0e0;
  }
</style>
</head>

<body>

<div class="card">
  <h2>will you be my valentine</h2>

  <div class="buttons" id="zone">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const zone = document.getElementById("zone");

  // YES button safe zone (absolute, never enter)
  const YES_LEFT = 40;
  const YES_WIDTH = 90;
  const GAP = 20;

  let side = "right";

  function moveNo() {
    const zoneWidth = zone.clientWidth;
    const noWidth = noBtn.offsetWidth;

    // Calculate safe ranges
    const leftLimit = YES_LEFT + YES_WIDTH + GAP;
    const rightLimit = zoneWidth - noWidth;

    let x;
    if (side === "right") {
      x = leftLimit;
      side = "left";
    } else {
      x = rightLimit;
      side = "right";
    }

    noBtn.style.left = x + "px";
  }

  // Mobile + Desktop (stable)
  noBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    moveNo();
  });

  yesBtn.addEventListener("click", () => {
    window.location.href = "yay.html";
  });
</script>

</body>
</html>
