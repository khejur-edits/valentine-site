<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
  <h2>will you be my valentine</h2>

  <div class="buttons" id="zone">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<script>
  const noBtn  = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const zone   = document.getElementById("zone");

  const sounds = ["s1.mp4","s2.mp4","s3.mp4","s4.mp4","s5.mp4"];

  function playRandomSound() {
    const audio = new Audio(
      sounds[Math.floor(Math.random() * sounds.length)]
    );
    audio.volume = 0.8;
    audio.play();
  }

  function getSafePosition() {
    const zoneRect = zone.getBoundingClientRect();
    const yesRect  = yesBtn.getBoundingClientRect();
    const noRect   = noBtn.getBoundingClientRect();

    let x, y, safe = false;

    while (!safe) {
      x = Math.random() * (zoneRect.width  - noRect.width);
      y = Math.random() * (zoneRect.height - noRect.height);

      const future = {
        left: zoneRect.left + x,
        right: zoneRect.left + x + noRect.width,
        top: zoneRect.top + y,
        bottom: zoneRect.top + y + noRect.height
      };

      // avoid final position overlapping YES
      safe = !(
        future.right  > yesRect.left &&
        future.left   < yesRect.right &&
        future.bottom > yesRect.top &&
        future.top    < yesRect.bottom
      );
    }

    return { x, y };
  }

  function moveNo() {
    const pos = getSafePosition();
    noBtn.style.left = pos.x + "px";
    noBtn.style.top  = pos.y + "px";
    playRandomSound();
  }

  // Mobile + Desktop
  noBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    moveNo();
  });

  yesBtn.addEventListener("click", () => {
    window.location.href = "yay.html";
  });
</script>

</body>
</html>
